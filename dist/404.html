/* 照片排法：輪播改成「第一張大圖＋其餘兩張一排」，橫滑卡片改成兩欄；單張維持單欄。點照片可放大。 */
function lxFig(ph,capHTML,cls){
  const f=document.createElement("figure"); f.className="lx-pf "+(cls||"");
  ph.classList.add("lx-zoom"); f.appendChild(ph);
  if(capHTML&&capHTML.trim()){ const c=document.createElement("figcaption"); c.innerHTML=capHTML; f.appendChild(c); }
  return f;
}
function lxPhotos(root){
  const build=items=>{ /* items: [[ph,cap]] */
    const box=document.createElement("div"); box.className="lx-photos";
    const [first,...rest]=items;
    box.appendChild(lxFig(first[0],first[1],"lx-pf-big"));
    for(let i=0;i<rest.length;i+=2){
      if(i+1<rest.length){ const row=document.createElement("div"); row.className="lx-pair"; row.appendChild(lxFig(rest[i][0],rest[i][1])); row.appendChild(lxFig(rest[i+1][0],rest[i+1][1])); box.appendChild(row); }
      else box.appendChild(lxFig(rest[i][0],rest[i][1],"lx-pf-big"));
    }
    return box;
  };
  root.querySelectorAll(".gal").forEach(g=>{
    const items=[...g.querySelectorAll(".slide")].map(sl=>[sl.querySelector(".ph"),(sl.querySelector(".cap p")||sl.querySelector(".cap")||{}).innerHTML||""]).filter(x=>x[0]);
    if(items.length) g.replaceWith(build(items));
  });
  root.querySelectorAll(".rail").forEach(r=>{
    const cards=[...r.querySelectorAll(".rail-card")]; if(!cards.length) return;
    const items=cards.map(c=>{ const cap=c.querySelector("figcaption"); return [c.querySelector(".ph"), cap?cap.innerHTML:""]; }).filter(x=>x[0]);
    const box=document.createElement("div"); box.className="lx-photos";
    if(items.length===1) box.appendChild(lxFig(items[0][0],items[0][1],"lx-pf-big"));
    for(let i=0;i+1<items.length;i+=2){ const row=document.createElement("div"); row.className="lx-pair"; row.appendChild(lxFig(items[i][0],items[i][1])); row.appendChild(lxFig(items[i+1][0],items[i+1][1])); box.appendChild(row); }
    if(items.length>1&&items.length%2) box.appendChild(lxFig(items[items.length-1][0],items[items.length-1][1],"lx-pf-big"));
    r.replaceWith(box);
  });
  root.querySelectorAll(".fig .ph").forEach(ph=>ph.classList.add("lx-zoom"));
  root.querySelectorAll(".lx-zoom").forEach(ph=>{ ph.setAttribute("role","button"); ph.setAttribute("tabindex","0"); ph.setAttribute("aria-label","放大照片"); });
}
(function(){
  const open=ph=>{ const img=ph.querySelector("img"); if(!img) return;
    const fig=ph.closest("figure,.slide"), cap=fig&&fig.querySelector("figcaption,.cap p");
    let lb=document.getElementById("lxLb");
    if(!lb){ lb=document.createElement("div"); lb.id="lxLb"; lb.className="lx-lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","放大照片"); document.body.appendChild(lb);
      lb.addEventListener("click",()=>close()); }
    lb.innerHTML=`<button type="button" class="lx-lb-x" aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><img class="scene lx-lb-img" src="${img.currentSrc||img.src}" alt="${(img.alt||"").replace(/"/g,"&quot;")}">${cap?`<p>${cap.textContent}</p>`:""}`;
    lb._from=ph; lb.classList.add("on"); document.body.classList.add("lx-lock"); lb.querySelector(".lx-lb-x").focus();
  };
  const close=()=>{ const lb=document.getElementById("lxLb"); if(!lb||!lb.classList.contains("on")) return; lb.classList.remove("on"); document.body.classList.remove("lx-lock"); lb._from&&lb._from.focus({preventScroll:true}); };
  document.addEventListener("click",e=>{ const ph=e.target.closest(".lx-zoom"); if(ph&&!e.target.closest(".gal-nav")){ e.preventDefault(); open(ph); } });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); const ph=e.target.closest&&e.target.closest(".lx-zoom"); if(ph&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); open(ph); } });
})();
/* 目錄跳轉：用 JS 捲動，避免改到網址 hash（預覽版用 hash 換頁） */
document.addEventListener("click",e=>{ const a=e.target.closest("[data-toc]"); if(!a) return; e.preventDefault();
  const t=document.getElementById(a.dataset.toc); if(!t) return; const det=a.closest("details"); if(det) det.open=false;
  const y=t.getBoundingClientRect().top+scrollY-72; scrollTo({top:y,behavior:"smooth"}); t.setAttribute("tabindex","-1"); t.focus({preventScroll:true}); });

function route(){
  try{ closeD(); }catch(e){}
  const m = location.hash.match(/^#post-(.+)$/);
  const id = PAGE_POST || (m && m[1]);
  const p = id && posts.find(x=>x.id===id);
  if(p){
    article.innerHTML = articleHTML(p);
    relayout(article, p);
    wireGalleries(article); wireFloorTabs(article); wireRails(article);
    /* 正式網站：外連按鈕先經過 /go/<名稱>/ 轉跳頁，Cloudflare 才算得到點擊次數 */
    if(PROD) article.querySelectorAll("a[data-go]").forEach(a=>{ if(!a.dataset.href) a.dataset.href=a.getAttribute("href"); a.setAttribute("href","/go/"+a.dataset.go+"/"); });
    placeOffer();
    if(!PROD){ article.classList.remove("edit-on"); numberize(article); addNumBtn(article); }
    document.body.classList.add("reading"); bar.classList.remove("show");
    scrollTo(0,0);
  } else {
    document.body.classList.remove("reading");
  }
}
window.addEventListener("hashchange",route);

renderPop(); renderFilter(); renderList(); route();
/* 偵測封面照片下方（按鈕所在區域）的亮度 */
(function heroShadow(){
  const hero=document.querySelector(".hero"), img=hero&&hero.querySelector("img.scene"); if(!img) return;
  const run=()=>{ try{
    const c=document.createElement("canvas"), w=40, h=40; c.width=w; c.height=h;
    const x=c.getContext("2d",{willReadFrequently:true}), nw=img.naturalWidth, nh=img.naturalHeight;
    x.drawImage(img,0,nh*0.62,nw,nh*0.3,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data; let sum=0;
    for(let i=0;i<d.length;i+=4) sum+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
    hero.classList.toggle("is-light", sum/(d.length/4)/255 > 0.6);
  }catch(e){} };
  img.complete&&img.naturalWidth ? run() : img.addEventListener("load",run,{once:true});
})();
if(location.hash.startsWith("#cat-")){
  const c=decodeURIComponent(location.hash.slice(5));
  if(cats.includes(c)){ setCat(c); setTimeout(()=>document.getElementById("list-anchor").scrollIntoView(),60); }
}
