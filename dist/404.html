<meta property="og:description" content="Mika 的住宿開箱攻略：看完 IG 影片，在這裡看房型、價位、周邊美食景點和專屬優惠。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== 品牌配色：全站共用，改這裡就會全部更新 ===== */
    --c-white:#FFFFFF;  /* 頁面背景、文章卡片底色 */
    --c-ink:#1A1A1A;    /* 正文、一般標題 */
    --c-blue:#1A1A1A;   /* 小標、連結、主要按鈕、選中狀態 */
    --c-blue-50:#FCEBB3;/* 心得字卡底色 */
    --c-red:#A81919;    /* 分類標籤文字、折扣與優惠序號、正文重點字 */
    --c-red-50:#FCEDED; /* 分類標籤底色 */
    --c-lime:#F2C230;   /* 滑過、按下的互動提示（黃色） */
    --ink:var(--c-ink); --sub:#8a8a8e; --line:#ececec; --bg:var(--c-white); --soft:#FCEBB3;
    --accent:var(--c-blue); --accent-2:var(--c-blue-50);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* sticky bar */
  .bar{position:fixed;top:0;left:50%;transform:translate(-50%,-100%);width:100%;max-width:560px;z-index:30;
    background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;transition:transform .25s}
  .bar.show{transform:translate(-50%,0)}
  .bar .logo{font-weight:900;font-size:20px;letter-spacing:-.5px}
  .bar .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* hero */
  .hero{position:relative;height:640px;color:#fff;overflow:hidden}
  .hero .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 50%}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.35) 62%,rgba(0,0,0,.72) 100%)}
  .hero-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 18px) 18px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.5px}
  .brand .dot{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-size:15px}
  .hero-body{position:absolute;left:18px;right:18px;bottom:22px;z-index:2}
  .stats{font-size:13px;opacity:.9;margin-bottom:8px}
  .hero h1{font-size:30px;line-height:1.3;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .who{display:flex;align-items:center;gap:12px;margin:22px 0 18px}
  .avatar{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.8);overflow:hidden;flex:none}
  .who b{display:block;font-size:17px}
  .who span{font-size:13px;opacity:.8}
  .who .share{margin-left:auto}
  .actions{display:flex;gap:8px}
  .follow{flex:1;height:46px;border-radius:8px;background:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff}
  .sq{width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff}

  .sep{height:10px;background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

  /* notice */
  .notice{padding:22px 18px 18px;text-align:center}
  .notice small{color:var(--accent);font-weight:700;letter-spacing:3px;font-size:12px}
  .notice-track{position:relative;min-height:56px;margin-top:8px}
  .notice-item{position:absolute;inset:0;font-size:16px;line-height:1.6;opacity:0;transition:opacity .4s;display:flex;align-items:center;justify-content:center}
  .notice-item.on{opacity:1;position:relative}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#d6d6d6}
  .dots i.on{background:var(--ink)}

  /* popular */
  .sec-h{font-size:18px;font-weight:900;padding:24px 18px 14px}
  .pop{display:flex;gap:12px;overflow-x:auto;padding:0 18px 22px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .pop::-webkit-scrollbar{display:none}
  .pop a{flex:0 0 42%;scroll-snap-align:start}
  .thumb{border-radius:10px;overflow:hidden;aspect-ratio:1;position:relative}
  .pop h3{font-size:14px;line-height:1.45;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cat{font-size:12px;color:var(--sub);margin-top:6px}

  .ig{display:flex;align-items:center;gap:12px;padding:18px;color:var(--sub);font-size:14px}
  .ig .g{width:30px;height:30px;border-radius:8px;background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4);display:grid;place-items:center;flex:none}

  /* tabs */
  .tabs{transition:top .25s;display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;padding:0 18px}
  .tabs button{flex:1;padding:16px 0;font-weight:700;color:var(--sub);border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-color:var(--ink)}
  .toolbar{display:flex;align-items:center;padding:18px 18px 6px;position:relative}
  .filter{font-weight:700;font-size:17px;display:flex;align-items:center;gap:4px}
  .menu-pop{position:absolute;top:52px;left:18px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;display:none;z-index:6;min-width:150px}
  .menu-pop.on{display:block}
  .menu-pop button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px;font-size:15px}
  .menu-pop button.on{background:var(--accent-2);color:var(--accent);font-weight:700}
  .views{margin-left:auto;display:flex;gap:14px;color:#cfcfcf}
  .views button.on{color:var(--ink)}

  /* list modes */
  #list{padding:0 18px 40px}
  .card{display:block;padding:16px 0 20px;border-bottom:1px solid var(--line)}
  .card .date{font-size:13px;color:var(--sub);margin-bottom:10px}
  .card .thumb{aspect-ratio:16/9}
  .card h3{font-size:17px;line-height:1.45;margin-top:14px;font-weight:700}
  .card p{font-size:14px;color:var(--sub);line-height:1.6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tag{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:#555}
  .sample{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}

  #list.rows .card{display:flex;gap:14px;align-items:flex-start}
  #list.rows .card .thumb{flex:0 0 104px;aspect-ratio:1;order:2}
  #list.rows .card .txt{flex:1;order:1}
  #list.rows .card h3{margin-top:0;font-size:15px}
  #list.rows .tags,#list.rows .date{display:none}
  #list.rows .meta{font-size:12px;color:var(--sub);margin-top:8px;display:block}
  .meta{display:none}

  #list.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px 0 40px}
  #list.grid .card{padding:0;border:0}
  #list.grid .card .thumb{aspect-ratio:1;border-radius:0}
  #list.grid .card .txt,#list.grid .date{display:none}

  .reels{padding:40px 18px 60px;text-align:center;color:var(--sub);line-height:1.8}
  .reels a{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700}

  /* drawer */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .shade.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;right:0;width:86%;max-width:420px;background:#fff;z-index:41;transform:translateX(100%);transition:.25s;overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 0 30px}
  .drawer.on{transform:none}
  .drawer .head{display:flex;justify-content:space-between;align-items:center;padding:0 22px 20px;font-size:18px;font-weight:700;border-bottom:8px solid var(--soft)}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);padding:20px 10px;border-bottom:8px solid var(--soft)}
  .quick a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
  .quick span{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
  .dlist a{display:flex;align-items:center;gap:14px;padding:15px 24px;font-size:16px}
  .dlist hr{border:0;border-top:1px solid var(--line);margin:6px 24px}

  /* article */
  #article{display:none}
  body.reading #home{display:none}
  body.reading #article{display:block}
  .a-top{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;border-bottom:1px solid var(--line);z-index:10}
  .a-top .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a-cover{aspect-ratio:4/3}
  .a-body{padding:22px 20px 60px}
  .a-body .kicker{color:var(--accent);font-weight:700;font-size:13px}
  .a-body h1{font-size:24px;line-height:1.4;margin:8px 0 6px;font-weight:900}
  .a-body .d{color:var(--sub);font-size:13px}
  .a-body h2{font-size:18px;margin:34px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
  .a-body p{font-size:16px;line-height:1.85;color:#333}
  .todo{background:#fff8e6;border:1px dashed #e8c66a;color:#8a6a10;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;margin-top:10px}
  .info{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .info div{display:flex;padding:13px 16px;font-size:15px;border-bottom:1px solid var(--line)}
  .info div:last-child{border:0}
  .info dt{width:80px;color:var(--sub);flex:none}
  .spots{display:grid;gap:12px}
  .spot{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
  .spot .thumb{width:72px;flex:none;border-radius:8px}
  .spot b{font-size:15px}
  .spot small{display:block;color:var(--sub);font-size:13px;margin-top:3px}
  .cta{display:flex;gap:10px;margin-top:30px}
  .cta a{flex:1;text-align:center;padding:14px;border-radius:10px;font-weight:700;font-size:15px}
  .cta .p{background:var(--accent);color:#fff}
  .cta .s{background:var(--soft)}
  /* gallery: photo + its own caption slide together */
  .gal{position:relative;margin:0 -20px}
  .gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gal-track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
  .slide .ph{aspect-ratio:4/3;position:relative}
  .slide .cap{padding:14px 20px 0}
  .slide .cap b{display:block;font-size:16px;margin-bottom:4px}
  .slide .cap p{font-size:15px;line-height:1.75;color:#444}
  .gal-count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;z-index:2}
  .gal-nav{position:absolute;top:calc((100vw * .75) / 2);transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  @media(min-width:560px){.gal-nav{top:210px}}
  .gal-nav.prev{left:10px}.gal-nav.next{right:10px}
  .gal-nav[disabled]{opacity:0;pointer-events:none}
  .gal-dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .gal-dots i{width:6px;height:6px;border-radius:50%;background:#d6d6d6;transition:.2s}
  .gal-dots i.on{background:var(--accent);width:16px;border-radius:3px}
  /* ---------- real-photo posts ---------- */
  .thumb img,.ph img,.a-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .post p{margin-top:14px}
  .post h2+p,.post h3+p{margin-top:0}
  .post h3{font-size:16.5px;margin:26px 0 10px;font-weight:700}
  .post h4{font-size:15.5px;margin:20px 0 8px;font-weight:700;color:var(--c-ink)}
  .post h3+h4{margin-top:8px}
  .post h4+p{margin-top:0}
  .one{margin:22px 0 4px;padding:16px 18px;background:var(--cream,#fbf7f1);border-radius:12px;border-left:3px solid var(--accent);font-size:15.5px;line-height:1.8;color:#4a423b}
  .one small{display:block;font-size:11.5px;letter-spacing:.14em;color:#9a8f84;margin-bottom:6px}
  .tbl{width:100%;border-collapse:collapse;font-size:14.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tbl th,.tbl td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
  .tbl th{background:var(--soft);font-weight:700;font-size:13px;color:#555;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:0}
  .tbl.rooms td:nth-child(2){white-space:nowrap}
  .tbl td:first-child{white-space:nowrap;color:var(--sub)}
  .fig{margin:16px -20px 4px}
  .fig .ph{aspect-ratio:16/9}
  .fig figcaption{padding:10px 20px 0;font-size:14px;color:var(--sub);line-height:1.7}
  .who-list{display:grid;gap:10px}
  .who-list div{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .who-list b{display:block;font-size:15.5px;margin-bottom:4px}
  .who-list span{font-size:14.5px;color:#555;line-height:1.75}
  .spot-list{display:flex;flex-wrap:wrap;gap:8px}
  .spot-list span{padding:8px 14px;border-radius:99px;background:var(--soft);font-size:14.5px}
  .score{display:flex;align-items:baseline;gap:6px;margin-top:16px}
  .score b{font-size:34px;font-weight:900;color:var(--accent);letter-spacing:-.02em}
  .score span{color:var(--sub);font-size:14px}
  .price-note{margin-top:12px;font-size:14.5px;color:#555;background:var(--soft);padding:12px 14px;border-radius:10px}
  /* ---------- 編號模式（修改用，正式上線前會拿掉） ---------- */
  .numbtn{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--ink);white-space:nowrap}
  .numbtn.on{background:#ff6b3d;border-color:#ff6b3d;color:#fff}
  .edit-on [data-no]{position:relative}
  .edit-on [data-no]::before{content:attr(data-no);display:inline-block;background:#ff6b3d;color:#fff;font:700 11.5px/1 ui-monospace,Menlo,monospace;
    padding:4px 7px;border-radius:6px;margin-right:8px;vertical-align:2px;letter-spacing:.03em}
  .edit-on .fig[data-no]::before,.edit-on .slide[data-no]::before{position:absolute;top:10px;left:10px;z-index:3;margin:0;font-size:13px;padding:5px 9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .edit-on .slide[data-no],.edit-on .fig[data-no]{position:relative}
  .edit-on div[data-no]:not(.slide):not(.tlabel)::before{display:table;margin-bottom:8px}
  .tlabel{display:none}.edit-on .tlabel{display:block;margin-bottom:8px}
  .edit-tip{display:none;margin:0 20px;padding:10px 14px;border-radius:10px;background:#fff1eb;color:#a2492a;font-size:13.5px;line-height:1.6}
  .edit-on .edit-tip{display:block;margin-top:14px}
  /* ---------- deals ---------- */
  :root{--live:#ff8f6b;--code:#e9c27a;--soon:#a9c7ff;--ended:#b9b9b9;--cream:#fbf7f1;--sand:#eadfcd;--deep:#2b2622}
  .badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:99px;
    background:rgba(24,22,20,.5);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
    color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.08em;line-height:1;border:1px solid rgba(255,255,255,.18);z-index:1}
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
  .badge.live i{animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,143,107,.7)}70%{box-shadow:0 0 0 7px rgba(255,143,107,0)}100%{box-shadow:0 0 0 0 rgba(255,143,107,0)}}
  .badge.ended{background:rgba(255,255,255,.72);color:#777;border-color:rgba(0,0,0,.05)}
  .live{--c:var(--live)}.code{--c:var(--code)}.soon{--c:var(--soon)}.ended{--c:var(--ended)}
  #list.rows .badge{top:6px;left:6px;padding:4px 7px;font-size:10px;gap:5px}
  #list.grid .badge{top:8px;left:8px}
  .deal-line{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#b5603f;margin-top:8px;letter-spacing:.02em}
  .deal-line.soon{color:#5277b5}.deal-line.code{color:#9a7428}
  .deal-line::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c)}

  .deal{position:relative;margin:26px 0 6px;background:var(--cream);border:1px solid var(--sand);border-radius:18px;padding:20px 20px 16px;overflow:hidden}
  .deal::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),rgba(255,255,255,0))}
  .deal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .deal-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--deep)}
  .deal-chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .deal.live .deal-chip i{animation:pulse 1.8s infinite}
  .deal-cd{font-size:12.5px;font-weight:700;color:var(--deep);background:#fff;border:1px solid var(--sand);padding:5px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
  .deal h3{font-size:19px;font-weight:900;margin:14px 0 6px;letter-spacing:-.01em;color:var(--deep)}
  .deal .perk{font-size:15px;line-height:1.7;color:#5a5048}
  .deal .period{font-size:12.5px;color:#9a8f84;margin-top:8px;letter-spacing:.03em}
  .cut{position:relative;height:1px;margin:18px -20px;border-top:1.5px dashed var(--sand)}
  .cut::before,.cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--sand)}
  .cut::before{left:-11px}.cut::after{right:-11px}
  .code-row{display:flex;align-items:center;gap:12px}
  .code-row small{display:block;font-size:11px;letter-spacing:.14em;color:#9a8f84;margin-bottom:4px}
  .code-row b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;letter-spacing:.12em;color:var(--deep)}
  .copy{margin-left:auto;padding:10px 16px;border-radius:10px;border:1px solid var(--deep);font-size:14px;font-weight:700;transition:.2s;white-space:nowrap}
  .copy.done{background:var(--deep);color:#fff}
  .deal-go{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;padding:14px;border-radius:12px;background:var(--deep);color:#fff;font-weight:700;font-size:15px;letter-spacing:.04em}
  .deal .disc{font-size:11.5px;color:#a69b90;line-height:1.6;margin-top:12px;text-align:center}
  .deal.ended{background:#f7f7f6;border-color:#e6e6e4}
  .deal.ended h3,.deal.ended .perk{color:#999}
  .deal.ended .deal-go{background:#e9e9e7;color:#777}
  .deal.soon .deal-go{background:#fff;color:var(--deep);border:1px solid var(--deep)}
  .proto{font-size:12px;color:var(--sub);text-align:center;padding:20px 18px 40px}

  /* =====================================================
     配色與互動狀態（只改顏色，不動結構、尺寸、間距）
     ===================================================== */
  html,body{background:var(--c-white);color:var(--c-ink)}
  .a-body p,.slide .cap p,.who-list span,.tbl td,.tbl th,.price-note,.deal .perk,.deal .period,.card p{color:var(--c-ink)}
  .card p,.deal .period{opacity:.72}

  /* 區塊小標 */
  .sec-h,.a-body h2,.notice small,.a-body .kicker{color:var(--c-blue)}
  .a-body h2{border-left-color:var(--c-blue)}
  .card h3,.pop h3,.a-body h1,.a-body h3{color:var(--c-ink)}

  /* 正文重點字與連結 */
  /* 重點字：深紅＋劃重點底線 */
  .post strong{color:var(--c-red);font-weight:700;
    background:linear-gradient(rgba(168,25,25,.2),rgba(168,25,25,.2)) left 100% / 100% .34em no-repeat;
    padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .ask-row b,.gscore b{background:none}
  /* 選單線條圖示 */
  .mi{width:21px;height:21px;stroke-width:1.6;color:var(--c-ink);flex:none}
  .quick .mi{width:24px;height:24px}
  .post p a,.post li a,.post td a{color:var(--c-blue);text-decoration:underline;text-underline-offset:3px}
  strong.off,.deal .perk strong.off{color:var(--c-red);font-weight:700}

  /* 心得字卡 */
  .one{background:var(--c-blue-50);border-left-color:var(--c-blue);color:var(--c-ink)}
  .one small{color:var(--c-blue);font-weight:700}

  /* 分頁與分類選中 */
  .tabs button.on{color:var(--c-blue);border-color:var(--c-blue)}
  .views button.on{color:var(--c-blue)}
  .menu-pop button.on{background:var(--c-blue);color:var(--c-white)}
  .gal-dots i.on,.dots i.on{background:var(--c-blue)}
  .score b{color:var(--c-blue)}

  /* 橢圓分類標籤：平常淡紅底深紅字 → 滑過萊姆綠 → 選中深藍 */
  .tag,.spot-list span{background:var(--c-red-50);color:var(--c-red);transition:background-color .15s,color .15s}
  .tag.on{background:var(--c-blue);color:var(--c-white)}

  /* 主要按鈕：深藍底白字 → 滑過/按下萊姆綠底墨黑字 */
  .follow,.cta .p,.deal-go,.reels a{background:var(--c-blue);color:var(--c-white);transition:background-color .15s,color .15s}
  .deal.soon .deal-go{background:var(--c-blue);color:var(--c-white);border-color:var(--c-blue)}
  .deal.ended .deal-go{background:#e9e9e7;color:#777}

  /* 優惠區 */
  .deal{background:var(--c-white)}
  .code-row b{color:var(--c-red)}
  .deal-line.live,.deal-line.code{color:var(--c-red)}
  .deal-line.soon{color:var(--c-blue)}
  .copy{border-color:var(--c-ink);color:var(--c-ink);transition:background-color .15s,color .15s,border-color .15s}
  .copy.done{background:var(--c-blue);border-color:var(--c-blue);color:var(--c-white)}

  /* 住宿卡片：滑過時照片外一圈細深藍框（用陰影，不改尺寸位置） */
  .card .thumb,.pop .thumb{transition:box-shadow .15s}
  .gal-nav{transition:background-color .15s}

  /* 官方 LINE／優惠碼字卡 */
  .ask{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .ask-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--c-white);display:flex;flex-direction:column;gap:10px}
  .ask-card small{font-size:12.5px;font-weight:700;color:var(--c-blue);letter-spacing:.04em}
  .ask-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ask-row b{font-size:17px;font-weight:700;color:var(--c-ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.02em}
  .ask-row b.code{color:var(--c-red);letter-spacing:.08em}
  .ask-row .copy{margin-left:auto;padding:6px 12px;font-size:13px;border-radius:8px}
  .ask-go{display:block;text-align:center;padding:10px;border-radius:10px;background:var(--c-blue);color:var(--c-white);font-weight:700;font-size:14px;transition:background-color .15s,color .15s;margin-top:auto}
  .ask-note{font-size:12.5px !important;color:var(--sub) !important;margin:auto 0 0 !important;line-height:1.5 !important}
  .cond{color:var(--c-ink);font-size:13.5px}
  .who-titles{grid-template-columns:1fr 1fr}
  .who-titles div{padding:12px 14px}
  .who-titles b{margin:0;font-size:15px}
  .gscore{display:flex;align-items:center;gap:12px;margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .gscore>div{display:flex;align-items:center;gap:10px}
  .gscore b{font-size:30px;font-weight:900;color:var(--c-blue);letter-spacing:-.02em}
  .gscore span{font-size:14px;font-weight:700;line-height:1.4}
  .gscore em{font-style:normal;font-weight:400;font-size:12px;color:var(--sub)}
  .gscore a{margin-left:auto;color:var(--c-blue);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:700;white-space:nowrap}
  .edit-only{display:none}
  .edit-on .edit-only{display:block;padding:12px 14px;border:1px dashed #ff6b3d;border-radius:10px;color:#a2492a;font-size:14px}
  @media (hover:hover){ .ask-go:hover{background:var(--c-lime);color:var(--c-ink)} }
  .ask-go:active{background:var(--c-lime);color:var(--c-ink)}
  /* 開頭藍底字卡（A1～A3） */
  .one.intro{padding:16px 13px 18px 14px}
  .a-body .one.intro p{margin-top:14px;color:var(--c-ink);font-size:16px;line-height:1.85}
  .one.intro p:first-child{margin-top:0}
  /* 觀看影片字卡 */
  .video-card{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--c-white);transition:border-color .15s,box-shadow .15s}
  .vc-thumb{position:relative;flex:0 0 112px;aspect-ratio:4/3;border-radius:10px;overflow:hidden}
  .vc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .vc-thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
  .vc-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:1;transition:background-color .15s}
  .vc-play svg{width:18px;height:18px;fill:var(--c-blue);margin-left:2px}
  .vc-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .vc-txt small{font-size:12px;font-weight:700;color:var(--c-blue);letter-spacing:.06em}
  .vc-txt b{font-size:15.5px;line-height:1.45;color:var(--c-ink)}
  .vc-txt span{font-size:13px;color:var(--sub)}
  @media (hover:hover){ .video-card:hover{border-color:var(--c-blue);box-shadow:0 0 0 1px var(--c-blue)} .video-card:hover .vc-play{background:var(--c-lime)} }
  .video-card:active{border-color:var(--c-blue);box-shadow:0 0 0 1px var(--c-blue)}
  .video-card:active .vc-play{background:var(--c-lime)}
  /* 直式照片 */
  .fig.tall .ph{aspect-ratio:4/5}
  /* 文末聲明：一行、小字 */
  /* 官方 LINE＋複製詢問 */
  .ask-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
  .ask-actions>*{flex:1 1 100px}
  .ask-actions .ask-go{margin-top:0}
  .ask-card .ask-copy{margin:0;padding:10px;border-radius:10px;font-size:14px;text-align:center}
  .a-body p.ask-hint{font-size:12px;line-height:1.55;color:var(--sub);margin:0}
  /* 次要按鈕 */
  .btn-ghost{display:block;width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1px solid var(--c-ink);background:var(--c-white);color:var(--c-ink);font-size:15px;font-weight:700;text-align:center}
  /* 手動複製視窗 */
  #manual-copy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
  #manual-copy.on{display:flex}
  .mc-panel{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
  .mc-panel p{font-size:13px;color:var(--sub)}
  .mc-panel textarea{width:100%;min-height:150px;font:inherit;font-size:14px;line-height:1.6;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical}
  .mc-panel button{padding:11px;border-radius:10px;background:var(--c-blue);color:#fff;font-weight:700}
  /* 封面個人區 */
  .who b em{font-style:normal;font-weight:500;font-size:14px;opacity:.88}
  /* IG 頻道按鈕 */
  .ig-ch{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px}
  .ig-btn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#fff;
    background:linear-gradient(45deg,#f9a03f 0%,#f2564f 30%,#e1306c 55%,#c13584 75%,#833ab4 100%);
    box-shadow:0 2px 10px rgba(193,53,132,.22);transition:filter .15s,transform .15s}
  .ig-btn .igi{width:26px;height:26px;flex:none;fill:none;stroke:#fff;stroke-width:1.8;color:#fff}
  .ig-btn span{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .ig-btn b{font-size:15px}
  .ig-btn small{font-size:11.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (hover:hover){ .ig-btn:hover{filter:brightness(1.08) saturate(1.1)} }
  .ig-btn:active{transform:scale(.98);filter:brightness(1.08)}
  /* 折扣碼／團購中標籤：閃耀 */
  .badge.code,.badge.live{overflow:hidden}
  .badge.code::after,.badge.live::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:shine 2.4s ease-in-out infinite}
  .badge.code i{box-shadow:0 0 8px 1px rgba(233,194,122,.9)}
  @keyframes shine{0%{left:-60%}55%,100%{left:130%}}
  @media (prefers-reduced-motion:reduce){ .badge.code::after,.badge.live::after{animation:none;display:none} }
  /* 搜尋 */
  .srch{position:fixed;inset:0;background:var(--c-white);z-index:50;display:none;flex-direction:column;max-width:560px;margin:0 auto}
  .srch.on{display:flex}
  .srch-bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
  .srch-bar input{flex:1;font:inherit;font-size:16px;border:0;outline:0;background:var(--soft);padding:10px 12px;border-radius:10px;color:var(--c-ink)}
  .srch-bar button{color:var(--c-blue);font-weight:700;font-size:15px}
  .srch-res{overflow-y:auto;padding:8px 16px 30px}
  .srch-hint{color:var(--sub);font-size:14px;text-align:center;padding:30px 0}
  .srch-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .srch-item .thumb{flex:0 0 72px;aspect-ratio:1;border-radius:8px}
  .srch-item .badge{display:none}
  .srch-item b{display:block;font-size:14.5px;line-height:1.45}
  .srch-item small{font-size:12.5px;color:var(--sub)}
  /* 提示小字 */
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,12px);background:var(--c-ink);color:#fff;
    font-size:14px;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:70;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  /* 文章排版：自然換行 */
  .a-body h1,.a-body h2,.a-body h3{text-wrap:balance}
  .a-body p,.a-body figcaption,.slide .cap p,.tbl td{text-wrap:pretty}
  .a-body p{font-size:16px;line-height:1.85}
  .nw{white-space:nowrap}
  .tbl .cond{display:block;margin-top:4px;font-size:13.5px}
  .gscore em{display:block}
  .gscore{flex-wrap:wrap;row-gap:6px}
  .gscore a{white-space:nowrap}
  .a-body p.note-line{font-size:12px;line-height:1.6;color:var(--sub);text-align:center;margin-top:22px;text-wrap:balance}
  .offer strong.off{background:none;padding:0}
  .offer .of-copy{min-width:9.5em}
  /* 單欄優惠卡 */
  .offer{margin-top:16px;background:var(--c-white);border:1px solid #e6e6e6;border-radius:16px;padding:4px 18px}
  .of-sec{padding:16px 0}
  .of-sec+.of-sec{border-top:1px solid #f0f0f0}
  .a-body h3.of-k{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--c-blue);letter-spacing:.02em}
  .a-body p.of-main{margin:0;font-size:20px;font-weight:700;color:var(--c-ink);line-height:1.5}
  .a-body p.of-sub{margin:4px 0 0;font-size:13px;color:var(--sub);line-height:1.6}
  .a-body p.of-code{margin:0 0 12px;font-size:15px;color:var(--c-ink);line-height:1.6}
  .of-code b{color:var(--c-red);font-weight:800;font-size:19px;letter-spacing:.06em;margin-left:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .of-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
  .offer .of-copy{margin:0;padding:10px 16px;border-radius:10px;border:1.5px solid var(--c-blue);color:var(--c-blue);background:var(--c-white);font-size:14.5px;font-weight:700}
  .of-hint{font-size:12.5px;color:var(--sub);line-height:1.6}
  .a-body p.of-hint{margin:8px 0 0;font-size:12.5px;text-align:center;color:var(--sub)}
  .of-line{display:block;text-align:center;padding:14px;border-radius:12px;background:var(--c-blue);color:var(--c-white);font-weight:700;font-size:15.5px;transition:background-color .15s,color .15s}
  .a-body p.of-id{margin:6px 0 0;font-size:12.5px;color:#9a9a9a;text-align:center}
  /* 分享給親友 */
  .btn-share{display:block;width:100%;margin-top:14px;padding:13px;border-radius:12px;background:var(--c-blue);color:var(--c-white);font-size:15px;font-weight:700;text-align:center;border:1px solid var(--c-blue)}
  /* 複製成功：黃色 */
  .copy.done,.offer .of-copy.done,.btn-share.done{background:var(--c-lime);border-color:var(--c-lime);color:var(--c-ink)}
  @media (hover:hover){ .of-line:hover{background:var(--c-lime);color:var(--c-ink)} }
  .of-line:active{background:var(--c-lime);color:var(--c-ink)}
  /* 照片圖說：白底＋左側短黃線 */
  .fig figcaption,.cover-fig figcaption,.slide .cap p{position:relative;background:var(--c-white);font-size:14px;line-height:1.7;color:#555;font-weight:400}
  .fig figcaption,.cover-fig figcaption{margin:10px 20px 0;padding:0 0 0 11px}
  .slide .cap{padding:10px 20px 0}
  .a-body .slide .cap p{font-size:14px;line-height:1.7;color:#555;margin:0;padding-left:11px}
  .fig figcaption::before,.cover-fig figcaption::before,.slide .cap p::before{content:"";position:absolute;left:0;top:calc(.85em - 8px);width:3px;height:16px;border-radius:2px;background:#F4D35E}
  .fig figcaption:empty,.slide .cap p:empty{display:none}
  .slide .cap:not(:has(p:not(:empty))){display:none}
  /* 圖說與段落間距 */
  .post .fig{margin:16px -20px 24px}
  .post .gal{margin-bottom:24px}
  .post .gal-dots{margin-top:12px}
  .post :is(.gal,.fig)+h3{margin-top:24px}
  .post :is(p,.facil)+:is(.gal,.fig){margin-top:22px}
  .cover-fig figcaption{margin-bottom:4px}
  /* 設施清單 */
  .facil{margin-top:4px}
  .fac-k{font-size:15px;font-weight:700;color:var(--c-blue);line-height:1.5}
  .fac-k+.fac-list{margin-top:6px}
  .a-body p.fac-list{margin-top:6px;color:var(--c-ink)}
  .fac-list+.fac-k{margin-top:16px}
  .facil+.gal{margin-top:24px!important}
  /* 優惠卡：淡奶油黃 */
  .offer{background:#FFFAE8}
  .a-body p.of-sub{color:#555}
  .offer .of-copy{background:transparent}
  /* 文章大標固定兩行：字級隨螢幕寬度縮放 */
  .a-body h1.h1-fit{font-size:min(24px,calc((min(100vw,560px) - 40px) / 19.4));line-height:1.45;letter-spacing:0}
  .h1-fit .h1l{display:block;white-space:nowrap}
  /* 圖片漸進載入 */
  .lq-box{background-color:#eceae6;background-size:cover;background-position:center}
  img.lq{opacity:0;transition:opacity .6s ease}
  img.lq.lq-in{opacity:1}
  img.lq.lq-instant{transition:none}
  /* 優惠卡「包棟定價 75 折」：黃色螢光筆劃重點 */
  .offer .mk{padding:.05em .2em;margin:0 -.2em;background:linear-gradient(100deg,rgba(255,210,63,.95),rgba(255,210,63,.7)) no-repeat 0 70%;
    background-size:0% 42%;animation:mkr 3s ease-in-out infinite;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  @keyframes mkr{0%{background-size:0% 42%;background-position:0 70%}38%,62%{background-size:100% 42%;background-position:0 70%}100%{background-size:0% 42%;background-position:100% 70%}}
  @media (prefers-reduced-motion:reduce){ .offer .mk{animation:none;background-size:100% 42%} }
  /* 「用 LINE 詢問空房」：深藍漸層自動緩慢流動 */
  .offer .of-line{background-color:var(--c-blue);background-image:linear-gradient(to right,#000000 0%,#1A1A1A 30%,#F2C230 51%,#1A1A1A 70%,#000000 100%);
    background-size:200% auto;background-position:left center;animation:lineFlow 4s ease-in-out infinite}
  @keyframes lineFlow{0%,100%{background-position:left center}50%{background-position:right center}}
  @media (hover:hover){ .offer .of-line:hover{background-image:none;background-color:var(--c-lime);color:var(--c-ink)} }
  .offer .of-line:active{background-image:none;background-color:var(--c-lime);color:var(--c-ink)}
  @media (prefers-reduced-motion:reduce){ .offer .of-line{animation:none;background-position:center} }
  /* 照片載入較慢時（超過 0.8 秒）才出現的 LOADING 動畫 */
  .lq-box{position:relative}
  .hero.lq-box{position:relative}
  .ld-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:1}
  .ld-ov.on{opacity:1}
  .ld{position:relative;display:inline-flex;padding-bottom:10px;font:700 20px/1.1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em}
  .ld-ov.sm .ld{font-size:15px;padding-bottom:8px}
  .ld b{font-weight:inherit;display:inline-block;color:rgba(255,255,255,.42);animation:ldHop 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .1s)}
  .ld::after{content:"";position:absolute;left:0;right:.14em;bottom:0;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#1A1A1A,#F2C230) 0 0/0% 100% no-repeat,rgba(255,255,255,.3);animation:ldBar 3.2s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes ldHop{0%,40%,100%{transform:translateY(0);color:rgba(255,255,255,.42);text-shadow:none}20%{transform:translateY(-6px);color:#fff;text-shadow:0 0 12px rgba(255,210,63,.8)}}
  @keyframes ldBar{0%{background-size:0% 100%,auto}85%,92%{background-size:100% 100%,auto;opacity:1}100%{background-size:100% 100%,auto;opacity:0}}
  @media (prefers-reduced-motion:reduce){ .ld b{animation:none;color:#fff} .ld::after{animation:none;background-size:60% 100%,auto} }
  /* 單張照片的相簿：不顯示滑動控制 */
  .gal.single .gal-count,.gal.single .gal-nav,.gal.single .gal-dots{display:none}
  /* 樓層分頁 */
  .floor-tabs{margin-top:18px}
  .ft-bar{position:relative;display:flex;border-bottom:1px solid var(--line);margin-bottom:4px}
  .ft-tab{flex:1;padding:12px 4px 11px;font-size:15px;font-weight:700;color:var(--sub);text-align:center;white-space:nowrap;transition:color .2s}
  .ft-tab.on{color:var(--c-red)}
  @media (hover:hover){ .ft-tab:not(.on):hover{color:var(--c-ink)} }
  .ft-tab:focus-visible{outline:2px solid var(--c-red);outline-offset:-2px;border-radius:6px}
  .ft-ind{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;background:var(--c-red);border-radius:2px;transition:transform .3s cubic-bezier(.3,1.1,.4,1),width .3s cubic-bezier(.3,1.1,.4,1)}
  .post .ft-panel h3.ft-title{margin:18px 0 10px}
  .post .ft-panel .gal{margin-bottom:0}
  .post .ft-panel+.ft-panel{margin-top:0}
  @media (prefers-reduced-motion:reduce){ .ft-ind{transition:none} }
  /* 設施卡片：可左右滑動，右側露出下一張 */
  .rail{position:relative;margin:0 -20px 24px}
  .rail-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding:0 20px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rail-track::-webkit-scrollbar{display:none}
  .rail-card{flex:0 0 82%;scroll-snap-align:start;margin:0;background:var(--c-white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rail-card .ph{aspect-ratio:4/3}
  .rail-card figcaption{padding:12px 14px 14px;background:var(--c-white);display:flex;flex-direction:column;gap:4px}
  .rail-card figcaption b{font-size:15px;line-height:1.5;color:var(--c-ink);font-weight:700}
  .rail-card figcaption span{position:relative;padding-left:11px;font-size:14px;line-height:1.7;color:#555;text-wrap:pretty}
  .rail-card figcaption span::before{content:"";position:absolute;left:0;top:calc(.85em - 8px);width:3px;height:16px;border-radius:2px;background:#F4D35E}
  .rail-nav{display:none;position:absolute;top:calc(41% - 18px);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);place-items:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:background-color .15s,opacity .2s}
  .rail-nav.prev{left:8px}.rail-nav.next{right:8px}
  .rail-nav[disabled]{opacity:0;pointer-events:none}
  @media (hover:hover){ .rail-nav{display:grid} .rail-nav:hover{background:var(--c-lime)} }
  .post .facil+.rail{margin-top:24px}
  /* 附近怎麼玩：三張直向卡片（只作用在 .nearby） */
  .nearby{--nb-blue:#1A1A1A;--nb-line:#1A1A1A;margin-top:-4px}
  .nearby .nb-sub{font-size:13.5px;color:#555;margin:0 0 14px}
  .nearby .nb-card{border:1px solid var(--nb-line);border-radius:14px;overflow:hidden;background:var(--c-white)}
  .nearby .nb-card+.nb-card{margin-top:12px}
  .nearby .nb-head{background:var(--nb-blue);color:#fff;padding:13px 16px 12px}
  .nearby .nb-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;line-height:1.4}
  .nearby .nb-ic{width:18px;height:18px;flex:none;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nearby .nb-desc{margin-top:4px;font-size:13.5px;line-height:1.6;color:#fff;text-wrap:balance}
  .nearby .nb-list{list-style:none;margin:0;padding:0;background:var(--c-white)}
  .nearby .nb-list li+li{border-top:1px solid var(--nb-line)}
  .post .nearby .nb-row{text-decoration:none}
  .nearby .nb-row{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px 10px 16px;color:var(--c-ink);transition:background-color .15s}
  .nearby .nb-name{flex:1;min-width:0;display:flex;flex-direction:column}
  .nearby .nb-name b{font-size:15px;font-weight:700;line-height:1.45}
  .nearby .nb-name small{font-size:12px;color:#777;line-height:1.4}
  .nearby .nb-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
  .nearby .nb-meta b{font-size:14.5px;font-weight:700;color:var(--nb-blue);line-height:1.4}
  .nearby .nb-meta small{font-size:12px;color:#888;line-height:1.4}
  .nearby .nb-ext{width:14px;height:14px;flex:none;fill:none;stroke:#8aa0bf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (hover:hover){ .nearby .nb-row:hover{background:#FCEBB3} .nearby .nb-row:hover .nb-ext{stroke:var(--nb-blue)} }
  .nearby .nb-row:active{background:#FCEBB3}
  .nearby .nb-row:focus-visible{outline:2px solid var(--nb-blue);outline-offset:-3px;border-radius:10px;background:#FCEBB3}
  .nearby .nb-note{margin-top:12px;font-size:12px;color:#888;text-align:center}
  /* 優惠卡放在文章最上方（大標之前） */
  .post>.offer:first-child{margin-top:0;margin-bottom:26px}
  /* 簡易版文章 */
  .tcover{display:block;width:100%;height:100%}
  .vc-thumb .tcover text{display:none}
  .post .hl-list{margin:0;padding:0;list-style:none}
  .post .hl-list li{position:relative;padding:10px 0 10px 22px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.7;text-wrap:pretty}
  .post .hl-list li:last-child{border-bottom:0}
  .post .hl-list li::before{content:"";position:absolute;left:4px;top:calc(10px + .85em - 4px);width:8px;height:8px;border-radius:50%;background:var(--c-blue)}
  .post .hl-list.warn li::before{background:var(--c-red)}
  .soon-note{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:14.5px;color:#555;line-height:1.7;text-align:center}
  /* 包棟價格 → 優惠卡 */
  .price-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFFAE8;border:1px solid #efe3bd;color:var(--c-ink);font-weight:700;transition:background-color .15s,border-color .15s}
  .pb-txt{min-width:0}
  .pb-arrow{flex:none;font-size:13.5px;font-weight:700;color:var(--c-blue)}
  @media (hover:hover){ .price-btn:hover{background:var(--c-lime);border-color:var(--c-lime)} .price-btn:hover .pb-arrow{color:var(--c-ink)} }
  .price-btn:active{background:var(--c-lime);border-color:var(--c-lime)}
  .price-btn:active .pb-arrow{color:var(--c-ink)}
  .offer{scroll-margin-top:76px}
  .offer.flash{animation:offerFlash 1.4s ease-out .35s}
  @keyframes offerFlash{0%{box-shadow:0 0 0 0 rgba(244,211,94,.9)}40%{box-shadow:0 0 0 6px rgba(244,211,94,.55)}100%{box-shadow:0 0 0 0 rgba(244,211,94,0)}}
  /* 滑鼠裝置：滑過 */
  @media (hover:hover){
    .tag:not(.on):hover,.menu-pop button:not(.on):hover,.spot-list span:hover{background:var(--c-lime);color:var(--c-ink)}
    .follow:hover,.cta .p:hover,.deal-go:hover,.reels a:hover,.copy:not(.done):hover{background:var(--c-lime);color:var(--c-ink);border-color:var(--c-lime)}
    .deal.ended .deal-go:hover{background:#e9e9e7;color:#777}
    .card:hover .thumb,.pop a:hover .thumb{box-shadow:0 0 0 2px var(--c-blue)}
    .gal-nav:hover{background:var(--c-lime)}
    .dlist a:hover,.quick a:hover span{background:var(--c-lime)}
    .tabs button:not(.on):hover,.views button:not(.on):hover{color:var(--c-ink)}
  }
  /* 觸控裝置：按下時短暫變色 */
  .tag:not(.on):active,.menu-pop button:not(.on):active,.spot-list span:active{background:var(--c-lime);color:var(--c-ink)}
  .follow:active,.cta .p:active,.deal-go:active,.reels a:active,.copy:not(.done):active{background:var(--c-lime);color:var(--c-ink);border-color:var(--c-lime)}
  .card:active .thumb,.pop a:active .thumb{box-shadow:0 0 0 2px var(--c-blue)}
  .gal-nav:active,.dlist a:active,.quick a:active span{background:var(--c-lime)}
  a,button{-webkit-tap-highlight-color:transparent}

  /* =====================================================
     電腦版（螢幕寬度 900px 以上才生效，手機版完全不受影響）
     ===================================================== */
  @media (min-width:900px){
    :root{--pad:max(32px, calc((100vw - 1120px) / 2))}
    body{max-width:none}
    /* 頂部橫列 */
    .bar{max-width:none;padding-left:var(--pad);padding-right:var(--pad)}
    /* 首頁封面 */
    .hero{height:min(80vh,640px)}
    .hero .scene{object-position:50% 30%}
    .hero::after{background:linear-gradient(90deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.22) 45%,rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
    .hero-top{padding-left:var(--pad);padding-right:var(--pad)}
    .hero-body{left:var(--pad);right:auto;width:min(620px, calc(100vw - 64px));bottom:52px}
    .stats{font-size:15px;margin-bottom:12px}
    .hero h1{font-size:48px;line-height:1.25}
    .who{margin:28px 0 22px}
    /* IG 頻道、公告、人氣文章 */
    .ig-ch{padding:22px var(--pad);grid-template-columns:repeat(2,minmax(0,300px))}
    .notice{padding-left:var(--pad);padding-right:var(--pad)}
    .sec-h{padding:34px var(--pad) 18px;font-size:22px}
    .pop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;overflow:visible;padding:0 var(--pad) 34px}
    .pop a{flex:none}
    .pop h3{font-size:15.5px}
    /* 文章列表 */
    .tabs{padding:0 var(--pad);justify-content:flex-start;gap:8px}
    .tabs button{flex:0 0 140px}
    .toolbar{padding:22px var(--pad) 6px}
    .menu-pop{left:var(--pad)}
    #list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;padding:0 var(--pad) 70px}
    #list>p{grid-column:1/-1}
    #list.rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
    #list.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px var(--pad) 70px}
    #list.grid .card .thumb{border-radius:10px}
    .reels{padding-left:var(--pad);padding-right:var(--pad)}
    /* 搜尋 */
    .srch{max-width:none;padding:0 max(24px, calc((100vw - 680px) / 2))}
    /* 文章頁：頂部、封面、雙欄 */
    #article .a-top{padding-left:var(--pad);padding-right:var(--pad)}
    #article .cover-fig{width:min(1120px, calc(100vw - 64px));margin:28px auto 0!important}
    #article .cover-fig .a-cover{aspect-ratio:21/9;border-radius:18px;overflow:hidden}
    #article .cover-fig figcaption{margin:12px 0 0}
    .a-cols{display:flex;align-items:flex-start;gap:56px;width:min(1120px, calc(100vw - 64px));margin:0 auto}
    .a-cols>.a-body:not(.a-side){flex:1 1 auto;min-width:0;max-width:720px;padding:34px 0 90px}
    .a-side{flex:0 0 340px;position:sticky;top:86px;padding:34px 0 40px}
    .a-side .offer{margin-top:0}
    .a-body h1.h1-fit{font-size:30px}
    /* 文章內照片：不再左右貼齊螢幕，改成圓角 */
    .post .gal{margin-left:0;margin-right:0;container-type:inline-size}
    .post .gal .ph{border-radius:14px;overflow:hidden}
    .post .gal-nav{top:calc(100cqw * .375)}
    .post .gal-nav.prev{left:14px}.post .gal-nav.next{right:14px}
    .post .slide .cap{padding:10px 0 0}
    .post .fig{margin-left:0;margin-right:0}
    .post .fig .ph{border-radius:14px;overflow:hidden}
    .post .fig figcaption{margin-left:0;margin-right:0}
    .post .fig.tall .ph{width:min(100%,520px)}
    .rail{margin-left:0;margin-right:0}
    .rail-track{padding:0 0 4px;scroll-padding:0}
    .rail-card{flex:0 0 calc((100% - 12px) / 2.35)}
  }

  /* ===== 2026-11 改版：芥末黃 × 墨黑＋黑邊陰影（照片不加框） ===== */
  /* 主要按鈕：黑底白字＋黑邊＋實心陰影 */
  .follow,.cta .p,.deal-go,.reels a,.ask-go,.mc-panel button,.of-line,.btn-share,.offer .of-line,.deal.soon .deal-go{background:#1A1A1A!important;background-image:none!important;color:#fff!important;border:2px solid #1A1A1A!important;border-radius:99px!important;box-shadow:3px 3px 0 #1A1A1A!important}
  /* 首頁封面「旅宿資訊」：黃底黑字 */
  .follow{background:var(--c-lime,#F5BF31)!important;color:#1A1A1A!important;border-color:#1A1A1A!important;box-shadow:3px 3px 0 #1A1A1A!important}
  .sq{background:#fff!important;border:2px solid #1A1A1A;border-radius:99px!important;color:#1A1A1A}
  /* IG 按鈕：黑底＋黃色陰影 */
  .ig-btn{background:#1A1A1A!important;border:2px solid #1A1A1A;box-shadow:4px 4px 0 #F2C230;border-radius:18px!important}
  .ig-btn .g,.ig .g{background:#F2C230!important;color:#1A1A1A}
  /* 次要按鈕：白底黑框 */
  .copy,.offer .of-copy,.btn-ghost,.ask-row .copy{border:2px solid #1A1A1A!important;border-radius:99px!important;box-shadow:3px 3px 0 #1A1A1A;background:#fff!important;color:#1A1A1A!important}
  /* 卡片：黑邊＋實心陰影 */
  .deal,.offer,.info,.ask-card,.gscore,.nearby .nb-card,.who-list div,.price-btn,.one,.tbl{border:2px solid #1A1A1A!important;border-radius:18px!important;box-shadow:5px 5px 0 #1A1A1A!important}
  .deal,.offer,.price-btn{background:#FFF8E1!important}
  .deal::before{display:none}
  .one{background:#FCEBB3!important;border-left-width:2px!important}
  /* 有照片的地方：不加黑邊、不加陰影 */
  .thumb,.card .thumb,.pop .thumb,.spot .thumb,.srch-item .thumb,#list.grid .card .thumb,#article .cover-fig .a-cover,.post .gal .ph,.post .fig .ph,.vc-thumb{border:0!important;box-shadow:none!important}
  .thumb,.card .thumb,.pop .thumb{border-radius:14px!important}
  .rail-card,.video-card,.spot{box-shadow:none!important;border:1.5px solid #E5DCC8!important;border-radius:18px!important}
  /* 標籤與小細節 */
  .tag,.spot-list span{background:#FCEBB3!important;color:#1A1A1A!important;border:1.5px solid #1A1A1A}
  .tag.on{background:#1A1A1A!important;color:#F2C230!important}
  .a-body h2{border-left:6px solid #F2C230!important}
  .a-body > h2,.a-body.post h2{font-size:21px;font-weight:900;line-height:1.4}  /* 大標比小標（18.5px）大，層級清楚 */
  .tabs button.on{border-bottom:3px solid #F2C230!important}
  .nearby .nb-head{background:#1A1A1A!important}
  .vc-play{background:#F2C230!important;color:#1A1A1A}
  .sep{background:#FFF8E1!important}
  /* 分類籤：取代原本只剩一個的「文章」分頁 */
  .tabs{padding:12px 18px!important;border-bottom:1px solid var(--line)!important}
  .cat-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 5px 2px}
  .cat-chips::-webkit-scrollbar{display:none}
  .cat-chips button{flex:none;height:38px;padding:0 16px;border-radius:99px;border:2px solid #1A1A1A;background:#fff;font-size:14.5px;font-weight:700;color:#1A1A1A;box-shadow:2px 2px 0 #1A1A1A}
  .cat-chips button.on{background:#1A1A1A;color:#F2C230;border:2px solid #1A1A1A!important}
  .toolbar .filter,.toolbar .menu-pop{display:none!important}
  /* 第二排：地區下拉＋優惠中開關 */
  .tabs{flex-direction:column;align-items:stretch}
  .sub-filters{display:flex;gap:8px;padding:6px 2px 4px}
  .tabs .sub-filters .chip-tog{flex:none;height:38px;padding:0 16px;color:#1A1A1A;border:2px solid #1A1A1A!important}
  .tabs .sub-filters .chip-tog.on{color:#F2C230}
  /* 整齊版：第一排縮小到手機一行放得下；第二排改成較輕的次要樣式 */
  /* 第二排：兩顆等寬撐滿整行（A 版：白底，選中黃底黑字） */
  /* 第一排：五顆撐滿整行、不用左右滑 */
  .tabs .cat-chips{overflow:visible;gap:6px;padding:2px 4px 5px 2px}
  .tabs .cat-chips button{flex:1 1 auto;min-width:0;padding:0 6px;white-space:nowrap}
  @media (max-width:350px){.tabs .cat-chips{gap:4px}.tabs .cat-chips button{padding:0 3px;font-size:13px}}
  @media (min-width:900px){.tabs .cat-chips{gap:8px}.tabs .cat-chips button{flex:none;padding:0 16px}}
  .tabs .sub-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 4px 5px 2px}
  .tabs .sub-filters .chip-sel,.tabs .sub-filters .chip-tog{width:100%;height:38px;justify-content:center;font-size:14.5px;border:2px solid #1A1A1A!important;box-shadow:2px 2px 0 #1A1A1A;background:#fff;color:#1A1A1A}
  .tabs .sub-filters .chip-sel.on,.tabs .sub-filters .chip-tog.on{background:#F2C230;color:#1A1A1A}
  .toolbar .f-clear{flex:none;margin-right:12px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;background:none;border:0}
  .toolbar .f-clear[hidden]{display:none}
  .toolbar .f-clear+.views{margin-left:0!important}
  .chip-sel,.chip-tog{position:relative;flex:none;display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px 0 16px;border-radius:99px;border:2px solid #1A1A1A;background:#fff;font-size:14.5px;font-weight:700;color:#1A1A1A;box-shadow:2px 2px 0 #1A1A1A;cursor:pointer}
  .chip-sel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .chip-sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;-webkit-appearance:none;appearance:none}
  .chip-tog{padding:0 16px}
  .chip-sel.on,.chip-tog.on{background:#1A1A1A;color:#F2C230}
  .chip-sel:focus-within{outline:2px solid #F2C230;outline-offset:2px}
  .empty-state{padding:44px 0 36px;text-align:center;color:var(--sub);font-size:15px}
  .empty-state button{margin-top:14px;height:40px;padding:0 20px;border-radius:99px;border:2px solid #1A1A1A;background:#F2C230;color:#1A1A1A;font-weight:800;font-size:14.5px;box-shadow:2px 2px 0 #1A1A1A}
  .card .meta{white-space:nowrap}
  .list-h{font-size:20px;font-weight:900;margin-right:auto}
  .toolbar{padding:22px 18px 4px!important;scroll-margin-top:60px}
  /* 資訊表：讓黑框圓角完整顯示 */
  .tbl{border-collapse:separate!important;border-spacing:0;overflow:hidden}
  /* 優惠標籤 A 方案「黃黑原色」：實色底，金黃共用「旅宿資訊」按鈕的 --c-lime */
  .badge{--gold:var(--c-lime,#F5BF31);background:var(--bb)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid var(--bl,transparent)!important;color:var(--bc)!important;overflow:visible!important}
  .badge::after{display:none!important}
  .badge i{width:7px;height:7px;background:var(--bc)!important;animation:none}
  .badge.code i,.badge.live i,.badge.soon i,.badge.ended i{box-shadow:none}  /* 不能加 !important，否則會蓋掉呼吸動畫 */
  .badge.code{--bb:#191919;--bc:var(--gold);--br:245,191,49}
  .badge.live{--bb:var(--gold);--bc:#191919;--br:25,25,25}
  .badge.soon{--bb:#FFF5DF;--bc:#191919;--bl:#191919}
  .badge.ended{--bb:#E5E5E5;--bc:#595959}
  .badge.code i{animation:bdgBr 1.6s ease-out infinite!important}
  .badge.live i{animation:bdgBr 1.2s ease-out infinite!important}

  /* 「用 LINE 詢問空房」：漸層自動緩慢流動。2026-11-15 顏色交換：金黃底＋淺色光帶、黑字；按下變墨黑底白字。

  :root{--lx-ink:#171717;--lx-sub:#525252;--lx-mute:#666666;--lx-gray:#F5F5F3;--lx-line:#E7E7E3;--lx-lime:#C7F000;

  /* 隱藏舊版首頁元件 */

  /* ---------------- 文章頁 ---------------- */

  .lx-as{display:block;font-family:var(--lx-sans);font-weight:500;font-size:17px;line-height:1.6;color:var(--lx-sub);margin-top:8px}
  .a-body.post p.lx-byline{font-size:14px!important;color:var(--lx-mute);margin:10px 0 0}
  .a-body .lx-cover{margin:20px -20px 0!important}
  .a-body .lx-cover .a-cover{aspect-ratio:auto!important;border-radius:0!important}
  .a-body .lx-cover .a-cover img{width:100%;height:auto!important;max-height:78vh;object-fit:cover}
  .a-body .lx-cover figcaption{margin:8px 20px 0!important;border:0!important;padding:0!important;font-size:14px;color:var(--lx-mute)}
  .a-body .lx-cover .a-cover svg{display:block;width:100%;height:auto}
  .lx-info{margin-top:20px;background:var(--lx-gray);border-radius:12px;padding:16px 18px}
  .lx-keys{display:grid;gap:12px;margin:0}
  .lx-keys div{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}

  .lx-more-b .tbl td{border-color:var(--lx-line)!important}
  .lx-more-b .gscore{margin-top:12px!important;background:#fff!important;border:0!important;box-shadow:none!important;border-radius:10px!important}

  .lx-toc{margin-top:16px;border:1px solid var(--lx-line);border-radius:12px;padding:2px 16px}
  .lx-toc ol{margin:0 0 10px;padding:0;list-style:none;counter-reset:t}

  .lx-toc li a{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15.5px;color:var(--lx-ink)}

  .lx-sec-a{margin-top:52px}
  .lx-sec-a>h2{font-family:var(--lx-serif)!important;font-weight:900!important;font-size:26px!important;line-height:1.35!important;margin:0 0 16px!important;padding:0!important;border:0!important;display:flex;align-items:center;gap:10px;scroll-margin-top:72px;color:var(--lx-ink)!important}
  .lx-sec-a>h2::before{content:"";width:4px;height:22px;background:var(--lx-lime);border-radius:2px;flex:none}

  /* 去除粗框、陰影、漸層、裝飾色 */

  .a-body .tbl,.a-body .gscore,.a-body .nearby .nb-card,.a-body .rail-card,.a-body .video-card,.a-body .fm-card,.a-body .who-list div,.a-body .price-btn{box-shadow:none!important;border:1px solid var(--lx-line)!important;border-radius:12px!important}
  .a-body .fm-card{background:var(--lx-gray)!important;border:0!important}
  .a-body .tbl th,.a-body .tbl tr:first-child th{background:var(--lx-gray)!important}
  .a-body .nearby .nb-head{background:var(--lx-gray)!important;color:var(--lx-ink)!important}
  .a-body .nearby .nb-head *{color:var(--lx-ink)!important;stroke:currentColor}
  .a-body .fm-tag{background:var(--lx-gray)!important}
  .a-body .vc-play{background:var(--lx-lime)!important}
  .a-body strong:not(.off){background:none!important;font-weight:700}

  .a-body .gal .ph,.a-body .fig .ph,.a-body .rail-card .ph{border-radius:10px!important}
  /* 樓層／房型切換：目前項目萊姆綠 */
  .a-body .ft-bar{border-bottom:0!important;gap:8px;display:flex;flex-wrap:wrap}
  .a-body .ft-tab{min-height:44px;padding:0 16px!important;border-radius:99px!important;border:1px solid #D4D4D0!important;background:#fff!important;color:var(--lx-ink)!important;font-weight:700}

  .a-body .lx-code .lx-copy.done{background:var(--lx-lime)!important;border-color:var(--lx-lime)!important}
  .lx-bk-btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}

  .a-body .lx-linkbtn{display:block;margin:12px auto 0;min-height:44px;background:none!important;border:0!important;box-shadow:none!important;font-size:14.5px;color:var(--lx-ink)!important;text-decoration:underline;text-underline-offset:4px;padding:0 4px!important}
  .a-body .lx-linkbtn.done{text-decoration:none;font-weight:700}
  .lx-booksec .cta{margin-top:16px!important}
  .lx-booksec .cta .p,.a-body .btn-share{background:#fff!important;color:var(--lx-ink)!important;border:1px solid #D4D4D0!important;box-shadow:none!important;border-radius:12px!important;min-height:48px}

    .lx-lead{font-size:24px}

  /* =====================================================================
     2026-11 第二輪：首頁全幅封面、清掉黃色裝飾、照片角落優惠標籤、文章資訊與訂房區
     萊姆綠只留給：選中的類型、選中的樓層、主要訂房按鈕
     ===================================================================== */
  .lx-vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* 封面：照片到手機左右邊緣，文字放在左上水面 */
  .lx-hero{position:relative;padding:0!important;display:block!important;overflow:hidden}
  .lx-hero-img{margin:0!important;border-radius:0!important;aspect-ratio:auto!important;height:min(calc(100svh - 60px - 52px),640px);min-height:460px;max-height:none!important}
  .lx-hero-img img{object-position:18% 50%}
  .lx-hero-txt{position:absolute;left:20px;right:20px;top:20px;z-index:2;pointer-events:none}
  /* 照片左上本身有深色倒影：只在文字後面加一層淡淡的白霧，讓黑字對比夠（實測 390px 最暗處 5.7:1） */
  .lx-hero-txt::before{content:"";position:absolute;left:-20px;top:-20px;width:390px;height:280px;background:radial-gradient(ellipse 210px 125px at 140px 100px,rgba(255,255,255,.8) 0%,rgba(255,255,255,.66) 55%,rgba(255,255,255,0) 100%);z-index:-1;pointer-events:none}.lx-hero-txt{isolation:isolate}
  .lx-hero .lx-title{font-size:46px;line-height:1.15;letter-spacing:.03em;color:#111}
  .lx-hero .lx-lead{font-size:21px;margin-top:8px;color:#111}
  .lx-hero-by{margin:0;padding:14px 20px 0;font-size:14px;line-height:1.6;color:var(--lx-sub)}
  /* 最新消息：一列文字連結 */
  #newsSec{padding-top:28px}
  .lx-news{display:flex!important;align-items:center;gap:12px;min-height:52px;padding:0!important;text-decoration:none!important;border-top:1px solid var(--lx-line);border-bottom:1px solid var(--lx-line)}
  .lx-news-k{flex:none;font-size:13px;font-weight:700;color:var(--lx-mute);letter-spacing:.06em}
  .lx-news-t{flex:1;min-width:0;font-size:15px;color:var(--lx-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lx-news .i{flex:none;width:18px;height:18px;color:var(--lx-mute)}
  /* 標題：不再加色條，用字和留白分區 */
  .lx-h::before,.lx-sec-a>h2::before{display:none!important}
  .lx-sec{padding-top:56px}
  .lx-sec-a{margin-top:60px}
  @media (hover:hover){.lx-card:hover .lx-ct,.lx-pcard:hover .lx-ct{text-decoration-color:var(--lx-ink)}}
  /* 卡片：照片左下角優惠標籤 */
  .lx-cd{display:none!important}
  .lx-ptag{position:absolute;left:12px;bottom:12px;z-index:2;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#171717;font-size:12.5px;font-weight:700;line-height:1.4;letter-spacing:.02em;box-shadow:none}
  /* 圖片說明：深灰小字，和照片左邊對齊，拿掉黃色直線 */
  .fig figcaption::before,.cover-fig figcaption::before,.slide .cap p::before,.rail-card figcaption span::before{display:none!important}
  .a-body .fig figcaption,.a-body .cover-fig figcaption,.a-body .slide .cap p,.a-body .rail-card figcaption span,.a-body .lx-cover figcaption{padding-left:0!important;margin-left:0!important;border:0!important;color:#525252!important;font-size:13.5px!important;line-height:1.6!important;text-align:left!important;background:none!important}
  .a-body .lx-cover figcaption{margin:8px 20px 0!important}
  .a-body .vc-play{background:var(--lx-ink)!important;color:#fff!important}
  .a-body .vc-play *{fill:#fff!important;stroke:#fff!important}
  .a-body .fm-h::before,.a-body h3::before{background:none!important;box-shadow:none!important}
  .a-body mark,.a-body .hl{background:none!important}
  /* 選單抽屜：去掉黃色 */
  .drawer .head,.quick{border-bottom-color:var(--lx-gray)!important}
  .quick span{background:var(--lx-gray)!important}
  .share-fab{display:none!important}
  /* 住宿資訊展開：同一塊灰底、兩欄文字 */
  .lx-more-b{padding:2px 0 6px}
  .lx-detail{margin:0}
  .lx-detail div{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:7px 0;align-items:baseline}
  .lx-detail dt{font-size:14px;color:var(--lx-mute)}
  .lx-detail dd{margin:0;font-size:15px;line-height:1.6;color:var(--lx-ink)}
  .lx-detail dd .cond{display:block;font-size:13.5px;color:var(--lx-sub)}
  @media (max-width:359px){.lx-detail div{grid-template-columns:1fr;gap:2px}}
  .a-body .lx-maplink,.a-body .lx-rate a{display:inline-flex;align-items:center;min-height:32px;margin-left:6px;font-size:14px;font-weight:700;color:var(--lx-ink)!important;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
  .a-body.post p.lx-rate{font-size:14px!important;color:var(--lx-sub);margin:8px 0 0!important;line-height:1.6!important}
  .lx-rate b{color:var(--lx-ink);font-weight:700;background:none}
  /* 文章目錄：灰底收合，每列整列可點 */
  .lx-toc{background:var(--lx-gray);border:0!important;border-radius:12px;padding:2px 18px}
  .lx-toc ol{margin:0 -18px 8px!important}
  .a-body .lx-toc li a{display:flex;width:100%;box-sizing:border-box;min-height:48px;padding:0 18px;text-decoration:none!important;border:0!important;background:none!important;color:var(--lx-ink)!important}
  .a-body .lx-toc li a::before{text-decoration:none}
  @media (hover:hover){.a-body .lx-toc li a:hover{background:#EBEBE7!important}}
  .a-body .lx-toc li a:active{background:#E4E4DF!important}
  /* 訂房區：折扣、排除日期、優惠碼集中；LINE 詢問是唯一整寬萊姆綠 */
  .lx-bk-big strong.off{color:#B42318!important;background:none!important}
  .a-body .lx-code .lx-copy{min-height:40px;padding:0 14px!important;font-size:14px}
  .lx-bk-btns .lx-btn-ghost{min-height:44px}
  .a-body.post p.lx-bk-id{margin-top:10px!important;text-align:center}
  .lx-acts{display:flex;flex-direction:column;align-items:flex-start;margin-top:14px;padding-top:6px;border-top:1px solid #E2E2DD}
  .a-body .lx-act,.a-body .lx-linkbtn.lx-act{display:inline-flex!important;align-items:center;width:auto!important;min-height:44px!important;margin:0!important;padding:0!important;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;font:inherit;font-size:15px!important;font-weight:700!important;color:var(--lx-ink)!important;text-decoration:underline!important;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}
  .a-body .lx-act.done{text-decoration:none!important}
  .lx-acts:empty{display:none}
  .lx-booksec .note-line{margin-top:18px!important;font-size:13.5px!important;text-align:left!important}
  #list.lx-list{padding:0!important}
  .lx-qx[hidden]{display:none!important}
  @media (min-width:900px){
    .lx-hero-img{height:min(calc(100vh - 68px - 48px),680px)}
    .lx-hero-img img{object-position:50% 22%}
    .lx-hero-txt{left:max(32px,calc((100vw - 1120px)/2));top:36px}
    .lx-hero .lx-title{font-size:60px}
    .lx-hero-txt::before{left:-120px!important;top:-60px!important;width:640px!important;height:360px!important;background:radial-gradient(ellipse 290px 150px at 320px 160px,rgba(255,255,255,.8) 0%,rgba(255,255,255,.64) 55%,rgba(255,255,255,0) 100%)!important}
    .lx-hero .lx-lead{font-size:24px}
    .lx-hero-by{padding:16px max(32px,calc((100vw - 1120px)/2)) 0}
  }

  /* =====================================================================
     2026-11 第三輪：黑色導覽列、封面縮短＋找住宿、人氣住宿兩欄、萊姆綠短線、照片一大兩小
     ===================================================================== */
  .lx-head,#article .a-top{background:#171717!important;border-bottom:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .lx-head .lx-logo,#article .a-top .lx-logo{font-family:var(--lx-sans);font-weight:800;font-size:15px;letter-spacing:.16em;color:#fff!important;text-decoration:none!important}
  .lx-head .lx-iconbtn,#article .a-top .lx-iconbtn,#article .a-top>a:first-child{color:#fff!important}
  .lx-head .lx-iconbtn .i,#article .a-top .i{stroke:#fff!important}
  @media (hover:hover){.lx-head .lx-iconbtn:hover,#article .a-top .lx-iconbtn:hover{background:rgba(255,255,255,.12)}}
  #article .a-top{min-height:60px;padding:0 8px 0 4px!important;gap:4px}
  #article .a-top>a:first-child{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}
  #article .a-top .t{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #article .a-top .lx-logo{flex:1}
  #article .a-top .numbtn{order:2;color:#fff;border-color:rgba(255,255,255,.6);background:none}
  #article .a-top .lx-iconbtn{order:3}
  /* 封面縮短：裁掉下方木地板，保留人物和水面 */
  .lx-hero-img{height:500px!important;min-height:0!important}
  .lx-hero-img img{transform:scale(1.22);transform-origin:14% 0}
  .lx-find{position:absolute;left:20px;bottom:20px;z-index:3;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#171717!important;font-size:15px;font-weight:700;text-decoration:none!important}
  @media (hover:hover){.lx-find:hover{background:#fff}}
  /* 人氣住宿：固定兩欄 */
  .lx-pop{display:grid!important;grid-template-columns:1fr 1fr;gap:28px 14px;overflow:visible!important;margin:0!important;padding:0!important;scroll-snap-type:none!important}
  .lx-pcard{flex:none!important;min-width:0}
  .lx-pcard .thumb{aspect-ratio:4/5!important}
  .lx-pcard .lx-ct{font-size:19px;line-height:1.35;margin-top:10px}
  .lx-pcard .lx-cs{font-size:14px;line-height:1.6;margin-top:4px}
  .lx-pcard .lx-ptag{left:8px;bottom:8px;font-size:12px;padding:3px 7px}
  .lx-arrows{display:none!important}
  /* 萊姆綠短線 */
  .lx-dash{width:36px;height:2px;background:#C7F000;opacity:1;margin:0 0 20px;border:0}

(function(){
  const keyOf=src=>{ const m=(src||"").match(/(img\/[^?#]+?)(_s)?(\.(?:jpe?g|png|webp))/i); return m?m[1]+m[3]:null; };
  function prep(img){
    if(img.dataset.lq) return; img.dataset.lq="1";
    const k=keyOf(img.getAttribute("src")); const ph=k&&LQIP[k]; const box=img.parentElement;
    if(!ph||!box) return;
    box.classList.add("lq-box"); box.style.backgroundImage=`url("${ph}")`;
    let ov=null, timer=null;
    const startTimer=()=>{ timer=setTimeout(()=>{
      if(img.classList.contains("lq-in") || img.classList.contains("scene") || box.clientWidth<200) return;
      ov=document.createElement("div"); ov.className="ld-ov"+(box.clientWidth<320?" sm":""); ov.setAttribute("aria-hidden","true");
      ov.innerHTML='<div class="ld">'+[..."LOADING"].map((c,i)=>`<b style="--i:${i}">${c}</b>`).join("")+'</div>';
      box.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("on"));
    },800); };
    /* 照片進到畫面才開始計時，畫面外的照片不會先出現 LOADING */
    if("IntersectionObserver" in window){
      const io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ io.disconnect(); if(!img.classList.contains("lq-in")) startTimer(); } });
      io.observe(box); img._io=io;
    } else startTimer();
    const done=()=>{ clearTimeout(timer); if(img._io) img._io.disconnect(); img.classList.add("lq-in");
      if(ov){ ov.classList.remove("on"); setTimeout(()=>ov.remove(),600); }
      setTimeout(()=>{ box.style.backgroundImage=""; },700); };
    if(img.complete && img.naturalWidth){ img.classList.add("lq","lq-in","lq-instant"); box.style.backgroundImage=""; return; }
    img.classList.add("lq");
    img.addEventListener("load",done,{once:true});
    img.addEventListener("error",done,{once:true});
  }
  const scan=root=>root.querySelectorAll&&root.querySelectorAll("img").forEach(prep);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.tagName==="IMG") prep(n); else scan(n); })))
    .observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener("DOMContentLoaded",()=>scan(document));
  scan(document);
})();

function legacyCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  ta.remove(); return ok;
}
async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  return legacyCopy(text);
}
function showManualCopy(text){
  let box=document.getElementById("manual-copy");
  if(!box){
    box=document.createElement("div"); box.id="manual-copy";
    box.innerHTML='<div class="mc-panel"><b>請手動複製下方文字</b><p>瀏覽器限制自動複製，長按或全選後複製即可。</p><textarea readonly></textarea><button type="button">關閉</button></div>';
    document.body.appendChild(box);
    box.querySelector("button").onclick=()=>box.classList.remove("on");
    box.onclick=e=>{ if(e.target===box) box.classList.remove("on"); };
  }
  const ta=box.querySelector("textarea"); ta.value=text;
  box.classList.add("on"); setTimeout(()=>{ ta.focus(); ta.select(); },50);
}
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copy"); if(!b) return; e.preventDefault();
  const text = b.dataset.copy ? COPY_TEXTS[b.dataset.copy] : b.dataset.code;
  if(!text) return;
  const label = b.dataset.label || "複製";
  const ok = await copyText(text);
  if(!ok){ showManualCopy(text); return; }
  b.textContent=b.dataset.done||"已複製 ✓"; b.classList.add("done");
  clearTimeout(b._t); b._t=setTimeout(()=>{ b.textContent=label; b.classList.remove("done"); },2000);
});

function floorTabs(floors){

  return `<div class="floor-tabs"><div class="ft-bar" role="tablist" aria-label="選擇樓層">${tabs}<span class="ft-ind" aria-hidden="true"></span></div>${panels}</div>`;
}
function wireFloorTabs(root){
  root.querySelectorAll(".floor-tabs").forEach(w=>{
    const tabs=[...w.querySelectorAll(".ft-tab")], ind=w.querySelector(".ft-ind");
    const move=t=>{ ind.style.width=t.offsetWidth+"px"; ind.style.transform=`translateX(${t.offsetLeft}px)`; };
    const select=(t,focus)=>{
      tabs.forEach(x=>{ const on=x===t; x.classList.toggle("on",on); x.setAttribute("aria-selected",on); x.tabIndex=on?0:-1;
        const pn=w.querySelector("#panel-"+x.dataset.floor); pn.hidden=!on;
        if(on){ const tr=pn.querySelector(".gal-track"); if(tr){ tr.scrollLeft=0; const g=pn.querySelector(".gal"); g&&g._update&&g._update(); } } });
      move(t); if(focus) t.focus();
    };
    tabs.forEach((t,i)=>{
      t.onclick=()=>select(t);
      t.onkeydown=e=>{ const k={ArrowRight:1,ArrowLeft:-1}[e.key]; if(!k&&e.key!=="Home"&&e.key!=="End") return; e.preventDefault();
        const j=e.key==="Home"?0:e.key==="End"?tabs.length-1:(i+k+tabs.length)%tabs.length; select(tabs[j],true); };
    });
    requestAnimationFrame(()=>{ ind.style.transition="none"; move(tabs.find(t=>t.classList.contains("on"))); requestAnimationFrame(()=>ind.style.transition=""); });
    addEventListener("resize",()=>move(tabs.find(t=>t.classList.contains("on"))));
  });
}

    <div class="rail-track">${cards.map(c=>`

        <figcaption>${c.title?`<b>${c.title}</b>`:""}${c.cap?`<span>${c.cap}</span>`:""}</figcaption></figure>`).join("")}

function wireRails(root){
  root.querySelectorAll(".rail").forEach(r=>{
    const tr=r.querySelector(".rail-track"), prev=r.querySelector(".prev"), next=r.querySelector(".next");
    const step=()=>{ const c=tr.querySelector(".rail-card"); return c?c.offsetWidth+parseFloat(getComputedStyle(tr).columnGap||12):tr.clientWidth; };
    const upd=()=>{ prev.disabled=tr.scrollLeft<4; next.disabled=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-4; };
    tr.addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true});
    prev.onclick=()=>tr.scrollBy({left:-step(),behavior:"smooth"});
    next.onclick=()=>tr.scrollBy({left:step(),behavior:"smooth"});
    upd();
  });
}
function gallery(items){
  return `<div class="gal${items.length<2?" single":""}">
    <span class="gal-count">1 / ${items.length}</span>
    <button class="gal-nav prev" disabled aria-label="上一張"><svg class="i" viewBox="0 0 24 24" style="width:20px"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="gal-nav next" aria-label="下一張"><svg class="i" viewBox="0 0 24 24" style="width:20px"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="gal-track">${items.map(s=>`
      <div class="slide"><div class="ph">${s.src?`<img src="${s.src}" alt="${s.t}" loading="lazy">`:art(...s.img)}</div>
        <div class="cap">${s.t?`<b>${s.t}</b>`:""}<p>${s.c}</p></div></div>`).join("")}
    </div>
    <div class="gal-dots">${items.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join("")}</div>
  </div>`;
}
function wireGalleries(root){
  root.querySelectorAll(".gal").forEach(g=>{
    const track=g.querySelector(".gal-track"), n=track.children.length;
    const count=g.querySelector(".gal-count"), dots=[...g.querySelectorAll(".gal-dots i")];
    const prev=g.querySelector(".prev"), next=g.querySelector(".next");
    const idx=()=>Math.round(track.scrollLeft/track.clientWidth);
    const update=()=>{ if(!track.clientWidth) return; const i=idx();
      count.textContent=`${i+1} / ${n}`;
      dots.forEach((d,k)=>d.classList.toggle("on",k===i));
      prev.disabled=i===0; next.disabled=i===n-1; };
    track.addEventListener("scroll",()=>requestAnimationFrame(update),{passive:true});
    prev.onclick=()=>track.scrollTo({left:(idx()-1)*track.clientWidth,behavior:"smooth"});
    next.onclick=()=>track.scrollTo({left:(idx()+1)*track.clientWidth,behavior:"smooth"});
    g._update=update;
  });
}

function numberize(root){
  const post=root.querySelector(".post"); if(!post) return;
  root.querySelectorAll("img").forEach(img=>{
    const m=img.getAttribute("src").match(/(\d\d)\.jpg$/); if(!m) return;
    const host=img.closest(".slide")||img.closest(".fig"); if(host) host.dataset.no="P"+m[1];
  });
  let sec=64, n=0;
  [...post.children].forEach(el=>{
    if(el.classList.contains("kicker")||el.classList.contains("d")||el.classList.contains("proto")) return;
    if(el.tagName==="H1"){ el.dataset.no="標題"; return; }
    if(el.tagName==="H2"){ sec++; n=0; el.dataset.no=String.fromCharCode(sec)+" 小標"; return; }
    if(el.classList.contains("fig")||el.classList.contains("gal")) return;
    if(sec===64){ sec=65; }
    const no=String.fromCharCode(sec)+(++n);
    if(el.tagName==="TABLE"){ const t=document.createElement("div"); t.className="tlabel"; t.dataset.no=no; el.before(t); }
    else el.dataset.no=no;
  });
}
function addNumBtn(root){
  const top=root.querySelector(".a-top"); if(!top||!root.querySelector(".post")) return;
  const b=document.createElement("button"); b.className="numbtn"; b.textContent="顯示編號";
  b.onclick=()=>{ const on=root.classList.toggle("edit-on"); b.classList.toggle("on",on); b.textContent=on?"隱藏編號":"顯示編號"; };
  top.appendChild(b);
  const tip=document.createElement("div"); tip.className="edit-tip";
  tip.innerHTML="修改時照編號寫就好，例如：「A2：改成……」「P08：圖說改成……」「P13：刪掉」。";
  top.after(tip);
}

/* 電腦版：把優惠卡移到右側固定欄，手機版放回原位 */
const DESK_MQ = matchMedia("(min-width:900px)");
function placeOffer(){
  const art=document.getElementById("article"); if(!art) return;
  const offer=art.querySelector(".offer"); if(!offer) return;
  let cols=art.querySelector(".a-cols");
  if(DESK_MQ.matches){
    const body=art.querySelector(".a-body"); if(!body) return;
    if(!cols){
      cols=document.createElement("div"); cols.className="a-cols";
      body.before(cols); cols.appendChild(body);
      const side=document.createElement("aside"); side.className="a-side a-body post"; cols.appendChild(side);
    }
    const side=cols.querySelector(".a-side");
    if(offer.parentElement!==side){
      const slot=document.createElement("span"); slot.className="offer-slot"; slot.hidden=true;
      offer.before(slot); side.appendChild(offer);
    }
  } else {
    const slot=art.querySelector(".offer-slot");
    if(slot){ slot.replaceWith(offer); }
    if(cols){ const body=cols.querySelector(".a-body:not(.a-side)"); cols.before(body); cols.remove(); }
  }
}
DESK_MQ.addEventListener("change",placeOffer);

const LX_KEYS = { "民宿":[["房型","room"],["入住人數","capacity"],["早餐","breakfast"]],
  "包棟民宿":[["可住人數","capacity"],["房間配置","room"],["衛浴","bath"]],

function lxKeyFacts(p){
  const x=LX_EXTRA[p.id]||{}; if(x.key) return x.key;

    bath:p.bath||"", transport:p.transport||"", parking:p.parkingText||info["停車"],

  };

function lxBooking(p){

  const ask=COPY_TEXTS[p.id+"-ask"];

      ${code?`<div class="lx-code"><span class="lx-code-k">優惠碼</span><b class="lx-code-v">${code}</b><button type="button" class="copy lx-copy" data-code="${code}" data-label="複製優惠碼" data-done="已複製">複製優惠碼</button></div>`:""}

/* 樓層切換多一顆「其他空間」：樓層分頁後面的衛浴、客廳等小段落收進這一頁 */
function lxOtherTab(sec){
  const ft=sec&&sec.querySelector(":scope > .floor-tabs"); if(!ft) return;
  const rest=[]; for(let n=ft.nextElementSibling;n;n=n.nextElementSibling) rest.push(n);
  if(!rest.some(n=>n.matches("h3"))) return;
  const bar=ft.querySelector(".ft-bar"), tabs=bar.querySelectorAll(".ft-tab"), last=tabs[tabs.length-1];
  const t=last.cloneNode(false); t.classList.remove("on"); t.dataset.floor="other"; t.textContent="其他空間";
  t.setAttribute("aria-selected","false"); t.tabIndex=-1; if(t.id) t.id=t.id.replace(/[^-]+$/,"other"); if(t.hasAttribute("aria-controls")) t.setAttribute("aria-controls","panel-other");
  (bar.querySelector(".ft-ind")||null) ? bar.insertBefore(t,bar.querySelector(".ft-ind")) : bar.appendChild(t);
  const lastPanel=[...ft.querySelectorAll(".ft-panel")].pop();
  const pn=lastPanel.cloneNode(false); pn.id="panel-other"; pn.hidden=true; if(pn.hasAttribute("aria-labelledby")&&t.id) pn.setAttribute("aria-labelledby",t.id);
  rest.forEach(n=>pn.appendChild(n));
  ft.appendChild(pn);
  bar.classList.toggle("ft-4",bar.querySelectorAll(".ft-tab").length===4);
}
